<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Kepuasan Pasien - Bidan Aliantina</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .rating-container {
            display: flex;
            justify-content: space-between;
            margin: 10px 0 20px 0;
            gap: 5px;
        }
        .rating-box {
            flex: 1;
            text-align: center;
        }
        .rating-box input[type="radio"] {
            display: none;
        }
        .rating-box label {
            display: block;
            background-color: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 10px 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .rating-box input[type="radio"]:checked + label {
            background-color: #0d9488;
            color: white;
            border-color: #0f766e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Survey Kepuasan Pasien</h1>
        <p>Bantu kami meningkatkan kualitas pelayanan dengan memberikan penilaian Anda.</p>
        
        <!-- Sila ganti token/ID Formspree di bawah ini jika sudah membuat form survey baru di akun Mama -->
        <form action="https://formspree.io/f/mqejvboo" method="POST">

            <div class="form-group">
                <label for="Nama Responden">Nama Pasien / Responden (Opsional)</label>
                <input type="text" id="Nama Responden" name="Nama Responden" placeholder="Masukkan nama Anda (boleh dikosongkan)">
            </div>

            <div class="form-group">
                <label>Bagaimana Pelayanan Bidan Aliantina?</label>
                <div class="rating-container">
                    <div class="rating-box">
                        <input type="radio" id="p_sangat_puas" name="Kepuasan Pelayanan" value="Sangat Puas" required>
                        <label for="p_sangat_puas">😊<br>Sangat Puas</label>
                    </div>
                    <div class="rating-box">
                        <input type="radio" id="p_puas" name="Kepuasan Pelayanan" value="Puas">
                        <label for="p_puas">🙂<br>Puas</label>
                    </div>
                    <div class="rating-box">
                        <input type="radio" id="p_cukup" name="Kepuasan Pelayanan" value="Cukup">
                        <label for="p_cukup">😐<br>Cukup</label>
                    </div>
                    <div class="rating-box">
                        <input type="radio" id="p_kurang" name="Kepuasan Pelayanan" value="Kurang">
                        <label for="p_kurang">🙁<br>Kurang</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Bagaimana Kebersihan Ruang Praktik?</label>
                <div class="rating-container">
                    <div class="rating-box">
                        <input type="radio" id="k_sangat_puas" name="Kebersihan Tempat" value="Sangat Bersih" required>
                        <label for="k_sangat_puas">✨<br>Sangat Bersih</label>
                    </div>
                    <div class="rating-box">
                        <input type="radio" id="k_puas" name="Kebersihan Tempat" value="Bersih">
                        <label for="k_puas">🧼<br>Bersih</label>
                    </div>
                    <div class="rating-box">
                        <input type="radio" id="k_cukup" name="Kebersihan Tempat" value="Cukup">
                        <label for="k_cukup">🧹<br>Cukup</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="Saran dan Masukan">Kritik, Saran, atau Testimoni</label>
                <textarea id="Saran dan Masukan" name="Saran dan Masukan" rows="4" placeholder="Tuliskan masukan agar pelayanan kami menjadi lebih baik lagi..." required></textarea>
            </div>

            <div class="btn-container" style="margin-top: 20px;">
                <button type="submit" class="btn">Kirim Survey</button>
                <a href="index.html" class="btn btn-secondary">Kembali</a>
            </div>
        </form>
    </div>

</body>
</html>
